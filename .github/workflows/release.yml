name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Immutable annotated v* tag to release or safely resume
        required: true
        type: string

permissions:
  contents: write
  packages: write
  attestations: write
  id-token: write

env:
  PROMOTION_JAVA_VERSION: '21.0.12+8.0.LTS'
  RELEASE_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}

concurrency:
  group: release-maven-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable annotated release identity
        run: |
          version="$(sed -n 's/^addon_version=//p' gradle.properties)"
          test -n "${version}"
          [[ "${version}" != *-SNAPSHOT ]]
          [[ "${RELEASE_TAG}" =~ ^v[0-9A-Za-z][0-9A-Za-z.+-]*$ ]]
          test "${RELEASE_TAG}" = "v${version}"
          git fetch --force --tags origin
          test "$(git cat-file -t "refs/tags/${RELEASE_TAG}")" = tag
          test "$(git rev-parse 'HEAD^{commit}')" = \
            "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
          echo "VERSION=${version}" >> "${GITHUB_ENV}"

      - name: Check out exact BlueMap backport
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jan-guenter/BlueMap
          ref: 9be321df995a1103808621d529eb72773e719d4d
          path: .ci/bluemap
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact detached BlueMap identities
        run: |
          test "$(git -C .ci/bluemap rev-parse --abbrev-ref HEAD)" = "HEAD"
          test "$(git -C .ci/bluemap rev-parse HEAD)" = \
            "9be321df995a1103808621d529eb72773e719d4d"
          test "$(git -C .ci/bluemap/api rev-parse HEAD)" = \
            "285c9a60eff3ac2b0cab308ce1058d1565be0971"
          git -C .ci/bluemap fetch --force --tags origin
          test "$(git -C .ci/bluemap describe --exact-match --tags HEAD)" = \
            "v5.22-agent.backport-5.22-mc1.21.1-2"

      - name: Set up exact promotion Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ env.PROMOTION_JAVA_VERSION }}

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install exact BlueMap add-on toolkit
        if: ${{ hashFiles('requirements/toolkit.txt') != '' }}
        run: |
          python -m pip install --disable-pip-version-check \
            --no-deps --require-hashes --only-binary=:all: \
            --requirement requirements/toolkit.txt
          test "$(bluemap-addon-toolkit --version)" = "0.1.0-alpha.1"

      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: '9.6.1'
          cache-provider: basic
          cache-read-only: true
          validate-wrappers: true

      - name: Acquire exact ephemeral candidate inputs
        run: |
          input_dir="${RUNNER_TEMP}/exact-inputs"
          mkdir -p "${input_dir}"
          curl --fail --location --retry 3 --retry-all-errors \
            --output "${input_dir}/arseng-2.1.1-beta.jar" \
            "https://www.curseforge.com/api/v1/mods/905641/files/6203425/download"
          test "$(stat -c %s "${input_dir}/arseng-2.1.1-beta.jar")" -eq 123229
          sha256sum --check <<SHA256SUMS
          9e2b78101f08bf325589cb98ffba9d91171fdd76ba587d54bdef9d5de18080bc  ${input_dir}/arseng-2.1.1-beta.jar
          SHA256SUMS
          curl --fail --location --retry 3 --retry-all-errors \
            --output "${input_dir}/appliedenergistics2-19.2.17.jar" \
            "https://www.curseforge.com/api/v1/mods/223794/files/7027323/download"
          test "$(stat -c %s "${input_dir}/appliedenergistics2-19.2.17.jar")" -eq 8230896
          sha256sum --check <<SHA256SUMS
          460d779a0609b81409907d9956de8f6f70a1b0912257e3e5c3c7e75ac9630e95  ${input_dir}/appliedenergistics2-19.2.17.jar
          SHA256SUMS
          curl --fail --location --retry 3 --retry-all-errors \
            --output "${input_dir}/ars_nouveau-1.21.1-5.13.0.jar" \
            "https://www.curseforge.com/api/v1/mods/401955/files/8517890/download"
          test "$(stat -c %s "${input_dir}/ars_nouveau-1.21.1-5.13.0.jar")" -eq 20096005
          sha256sum --check <<SHA256SUMS
          90796df69bfb39b1a9c79edbfa01c2425e5b86aea47dc55ebdcbf30e88f47592  ${input_dir}/ars_nouveau-1.21.1-5.13.0.jar
          SHA256SUMS
          curl --fail --location --retry 3 --retry-all-errors \
            --output "${input_dir}/bluemap-ae2-addon-0.1.0-alpha.3.jar" \
            "https://github.com/jan-guenter/bluemap-ae2-addon/releases/download/v0.1.0-alpha.3/bluemap-ae2-addon-0.1.0-alpha.3.jar"
          test "$(stat -c %s "${input_dir}/bluemap-ae2-addon-0.1.0-alpha.3.jar")" -eq 1252649
          sha256sum --check <<SHA256SUMS
          f7014e1c60bdf02fa22583a7b5b5cbf6f3076a0b2371601360775507d473a12d  ${input_dir}/bluemap-ae2-addon-0.1.0-alpha.3.jar
          SHA256SUMS

      - name: Build and verify accepted release candidate
        run: |
          input_dir="${RUNNER_TEMP}/exact-inputs"
          gradle --no-daemon \
            -PbluemapSourcePath=.ci/bluemap \
            -Pae2AddonJar="${input_dir}/bluemap-ae2-addon-0.1.0-alpha.3.jar" \
            -ParsengJar="${input_dir}/arseng-2.1.1-beta.jar" \
            -PappliedEnergisticsJar="${input_dir}/appliedenergistics2-19.2.17.jar" \
            -ParsNouveauJar="${input_dir}/ars_nouveau-1.21.1-5.13.0.jar" \
            "-PreleaseTag=${RELEASE_TAG}" \
            clean build generatePomFileForAddonPublication \
            generateMetadataFileForAddonPublication verifyReleaseCandidate

      - name: Prepare release assets
        run: |
          mkdir release
          cp "build/libs/bluemap-ars-energistique-addon-${VERSION}.jar" release/
          cp "build/libs/bluemap-ars-energistique-addon-${VERSION}-sources.jar" release/
          cp build/publications/addon/pom-default.xml \
            "release/bluemap-ars-energistique-addon-${VERSION}.pom"
          cp build/publications/addon/module.json \
            "release/bluemap-ars-energistique-addon-${VERSION}.module.json"
          (cd release && sha256sum -- * > SHA256SUMS && sha256sum --check SHA256SUMS)

      - name: Create or refresh draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            test "$(gh release view "${RELEASE_TAG}" \
              --json isDraft --jq '.isDraft')" = true
            gh release upload "${RELEASE_TAG}" release/* --clobber
          else
            gh release create "${RELEASE_TAG}" release/* \
              --draft --prerelease --generate-notes \
              --title "BlueMap Ars Énergistique Add-on ${VERSION}" --verify-tag
          fi

      - name: Attest release assets with Sigstore
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: release/*

      - name: Publish Maven package
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          input_dir="${RUNNER_TEMP}/exact-inputs"
          gradle --no-daemon \
            -PbluemapSourcePath=.ci/bluemap \
            -Pae2AddonJar="${input_dir}/bluemap-ae2-addon-0.1.0-alpha.3.jar" \
            -ParsengJar="${input_dir}/arseng-2.1.1-beta.jar" \
            -PappliedEnergisticsJar="${input_dir}/appliedenergistics2-19.2.17.jar" \
            -ParsNouveauJar="${input_dir}/ars_nouveau-1.21.1-5.13.0.jar" \
            publishAddonPublicationToGitHubPackagesRepository

      - name: Verify draft assets and publish public prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          downloaded="${RUNNER_TEMP}/release-assets"
          mkdir -p "${downloaded}"
          gh release download "${RELEASE_TAG}" --dir "${downloaded}"
          for asset in release/*; do
            cmp "${asset}" "${downloaded}/$(basename "${asset}")"
          done
          gh release edit "${RELEASE_TAG}" --draft=false --prerelease
