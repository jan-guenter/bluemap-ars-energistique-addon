name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PROMOTION_JAVA_VERSION: '21.0.12+8.0.LTS'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out add-on
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out exact BlueMap backport
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jan-guenter/BlueMap
          ref: 9be321df995a1103808621d529eb72773e719d4d
          path: .ci/bluemap
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact detached BlueMap identities
        run: |
          test "$(git -C .ci/bluemap rev-parse --abbrev-ref HEAD)" = "HEAD"
          test "$(git -C .ci/bluemap rev-parse HEAD)" = \
            "9be321df995a1103808621d529eb72773e719d4d"
          test "$(git -C .ci/bluemap/api rev-parse HEAD)" = \
            "285c9a60eff3ac2b0cab308ce1058d1565be0971"

      - name: Set up exact promotion Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ env.PROMOTION_JAVA_VERSION }}

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: '9.6.1'
          cache-provider: basic
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          validate-wrappers: true

      - name: Acquire exact ephemeral candidate inputs
        run: |
          input_dir="${RUNNER_TEMP}/exact-inputs"
          mkdir -p "${input_dir}"
          curl --fail --location --retry 3 --retry-all-errors \
            --output "${input_dir}/arseng-2.1.1-beta.jar" \
            "https://www.curseforge.com/api/v1/mods/905641/files/6203425/download"
          test "$(stat -c %s "${input_dir}/arseng-2.1.1-beta.jar")" -eq 123229
          sha256sum --check <<SHA256SUMS
          9e2b78101f08bf325589cb98ffba9d91171fdd76ba587d54bdef9d5de18080bc  ${input_dir}/arseng-2.1.1-beta.jar
          SHA256SUMS
          curl --fail --location --retry 3 --retry-all-errors \
            --output "${input_dir}/appliedenergistics2-19.2.17.jar" \
            "https://www.curseforge.com/api/v1/mods/223794/files/7027323/download"
          test "$(stat -c %s "${input_dir}/appliedenergistics2-19.2.17.jar")" -eq 8230896
          sha256sum --check <<SHA256SUMS
          460d779a0609b81409907d9956de8f6f70a1b0912257e3e5c3c7e75ac9630e95  ${input_dir}/appliedenergistics2-19.2.17.jar
          SHA256SUMS
          curl --fail --location --retry 3 --retry-all-errors \
            --output "${input_dir}/ars_nouveau-1.21.1-5.13.0.jar" \
            "https://www.curseforge.com/api/v1/mods/401955/files/8517890/download"
          test "$(stat -c %s "${input_dir}/ars_nouveau-1.21.1-5.13.0.jar")" -eq 20096005
          sha256sum --check <<SHA256SUMS
          90796df69bfb39b1a9c79edbfa01c2425e5b86aea47dc55ebdcbf30e88f47592  ${input_dir}/ars_nouveau-1.21.1-5.13.0.jar
          SHA256SUMS
          curl --fail --location --retry 3 --retry-all-errors \
            --output "${input_dir}/bluemap-ae2-addon-0.1.0-alpha.3.jar" \
            "https://github.com/jan-guenter/bluemap-ae2-addon/releases/download/v0.1.0-alpha.3/bluemap-ae2-addon-0.1.0-alpha.3.jar"
          test "$(stat -c %s "${input_dir}/bluemap-ae2-addon-0.1.0-alpha.3.jar")" -eq 1252649
          sha256sum --check <<SHA256SUMS
          f7014e1c60bdf02fa22583a7b5b5cbf6f3076a0b2371601360775507d473a12d  ${input_dir}/bluemap-ae2-addon-0.1.0-alpha.3.jar
          SHA256SUMS

      - name: Read project version
        id: version
        run: |
          version="$(sed -n 's/^addon_version=//p' gradle.properties)"
          test -n "${version}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          if [[ "${version}" == *-SNAPSHOT ]]; then
            echo "release_candidate=false" >> "${GITHUB_OUTPUT}"
          else
            echo "release_candidate=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Verify prototype
        if: steps.version.outputs.release_candidate == 'false'
        run: |
          input_dir="${RUNNER_TEMP}/exact-inputs"
          gradle --no-daemon \
            -PbluemapSourcePath=.ci/bluemap \
            -Pae2AddonJar="${input_dir}/bluemap-ae2-addon-0.1.0-alpha.3.jar" \
            -ParsengJar="${input_dir}/arseng-2.1.1-beta.jar" \
            -PappliedEnergisticsJar="${input_dir}/appliedenergistics2-19.2.17.jar" \
            -ParsNouveauJar="${input_dir}/ars_nouveau-1.21.1-5.13.0.jar" \
            clean prototypeCheck build

      - name: Verify reviewed release candidate
        if: steps.version.outputs.release_candidate == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          input_dir="${RUNNER_TEMP}/exact-inputs"
          gradle --no-daemon \
            -PbluemapSourcePath=.ci/bluemap \
            -Pae2AddonJar="${input_dir}/bluemap-ae2-addon-0.1.0-alpha.3.jar" \
            -ParsengJar="${input_dir}/arseng-2.1.1-beta.jar" \
            -PappliedEnergisticsJar="${input_dir}/appliedenergistics2-19.2.17.jar" \
            -ParsNouveauJar="${input_dir}/ars_nouveau-1.21.1-5.13.0.jar" \
            "-PreleaseTag=v${VERSION}" \
            clean build generatePomFileForAddonPublication \
            generateMetadataFileForAddonPublication verifyReleaseCandidate

      - name: Upload review outputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bluemap-ars-energistique-addon-${{ github.sha }}
          path: |
            build/libs/*.jar
            build/publications/addon/pom-default.xml
            build/publications/addon/module.json
            build/reports/**
          if-no-files-found: error
          retention-days: 14
